[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshai"
version = "0.1.0"
description = "MeshCore channel bot that answers messages with a local LLM, gated by vordur"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "meshcore>=2.3.9",
  "ollama>=0.6",
  "httpx>=0.27",
  "textual>=1.0",
  "vordur>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
meshai = "bot.cli:main"

[tool.setuptools]
packages = ["bot"]

# vordur is not on PyPI. During development it resolves to the sibling checkout;
# elsewhere install it from git first (see README) and this source is ignored.
[tool.uv.sources]
vordur = { path = "../GuardLLM", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::SyntaxWarning:confusables",
]
